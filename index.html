<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Emulator GBA na GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Game Boy Advance Online - Pokémon FireRed</h1>

        <!-- Status ładowania ROMu -->
        <div id="loading-status" style="margin-bottom: 10px; font-weight: bold; color: #555;">
            Pobieranie gry z repozytorium...
        </div>

        <!-- Ekran, na którym emulator będzie renderował grafikę -->
        <div id="emulator-container">
            <canvas id="gameboy-canvas" width="240" height="160"></canvas>
        </div>

        <div class="controls-info">
            <p><strong>Sterowanie:</strong> Strzałki = Ruch | Z = A | X = B | Enter = Start | Spacja = Select</p>
        </div>

        <!-- Opcjonalnie: Przycisk resetu lub startu, jeśli przeglądarka blokuje autostart -->
        <div class="file-loader" style="margin-top: 15px;">
            <button id="start-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;" disabled>Ładowanie gry...</button>
        </div>
    </div>

    <!-- Skrypty emulatora GBA (upewnij się, że używasz biblioteki np. mGBAJS, IodineGBA lub EmulatorJS) -->
    <script src="script.js"></script>
</body>
</html>
