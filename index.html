<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Emulator GBA na GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Game Boy Advance Online</h1>
        
        <!-- Ekran, na którym emulator będzie renderował grafikę -->
        <div id="emulator-container">
            <canvas id="gameboy-canvas" width="240" height="160"></canvas>
        </div>

        <div class="controls-info">
            <p><strong>Sterowanie:</strong> Strzałki = Ruch | Z = A | X = B | Enter = Start | Spacja = Select</p>
        </div>

        <!-- Przycisk do wczytania własnego pliku .gba z dysku (opcjonalnie) -->
        <div class="file-loader">
            <label for="rom-upload">Wgraj inny plik .gba:</label>
            <input type="file" id="rom-upload" accept=".gba">
        </div>
    </div>

    <!-- Skrypty emulatora GBA (np. powszechnie stosowane biblioteki webowe) -->
    <script src="script.js"></script>
</body>
</html>
